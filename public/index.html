<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flight Tracker — Live Air Traffic</title>
  <meta name="description" content="Live map of every tracked flight in the world. Search any flight number, callsign or registration.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="map" aria-label="Live flight map"></div>

  <!-- Top bar: brand + search -->
  <header class="topbar">
    <a class="brand" href="./" title="Flight Tracker">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      <span>Flight<b>Tracker</b></span>
    </a>
    <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="search-results">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search flight (BA117, PK785), callsign, registration…"
             aria-label="Search flights" aria-autocomplete="list" aria-controls="search-results">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </div>
  </header>

  <!-- Map tools -->
  <nav class="tools" aria-label="Map tools">
    <button class="tool" data-panel="layers" title="Map layers" aria-label="Map layers">
      <svg viewBox="0 0 24 24"><path d="M12 2 1 8l11 6 11-6-11-6zm0 15L3.2 12.2 1 13.4 12 19.5l11-6.1-2.2-1.2L12 17zm0 4.5-8.8-4.8L1 17.9 12 24l11-6.1-2.2-1.2-8.8 4.8z" transform="scale(.92) translate(1 0)"/></svg>
    </button>
    <button class="tool" data-panel="filters" title="Filters" aria-label="Filters">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v2l-7 7v6l-4-2v-4L3 7z"/></svg>
      <span class="tool-dot" id="filter-dot" hidden></span>
    </button>
    <button class="tool" data-panel="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <span class="tool-sep"></span>
    <button class="tool" id="btn-locate" title="Go to my location" aria-label="Go to my location">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm-1-7h2v3.06A8 8 0 0 1 19.94 11H23v2h-3.06A8 8 0 0 1 13 19.94V23h-2v-3.06A8 8 0 0 1 4.06 13H1v-2h3.06A8 8 0 0 1 11 4.06zm1 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    </button>
    <button class="tool" id="btn-world" title="Show whole world (W)" aria-label="Show whole world">
      <svg viewBox="0 0 24 24" class="stroke-icon"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3.5 9h17M3.5 15h17"/></svg>
    </button>
    <button class="tool" id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg>
    </button>
  </nav>

  <!-- Popover panels for the tools -->
  <section class="popover" id="panel-layers" hidden aria-label="Map layers">
    <h3>Map style</h3>
    <div class="style-grid" id="style-grid"></div>
    <h3>View</h3>
    <label class="switch"><input type="checkbox" id="opt-globe"><span>3D globe</span></label>
    <label class="switch"><input type="checkbox" id="opt-labels" checked><span>Flight labels</span></label>
    <label class="switch"><input type="checkbox" id="opt-trails"><span>Trails for all aircraft</span></label>
  </section>

  <section class="popover" id="panel-filters" hidden aria-label="Filters">
    <h3>Altitude</h3>
    <div class="range-row">
      <input type="range" id="f-alt-min" min="0" max="50000" step="1000" value="0" aria-label="Minimum altitude">
      <input type="range" id="f-alt-max" min="0" max="50000" step="1000" value="50000" aria-label="Maximum altitude">
    </div>
    <div class="range-label" id="f-alt-label">All altitudes</div>
    <h3>Show</h3>
    <label class="switch"><input type="checkbox" id="f-airliners" checked><span>Airliners &amp; jets</span></label>
    <label class="switch"><input type="checkbox" id="f-light" checked><span>Light aircraft &amp; gliders</span></label>
    <label class="switch"><input type="checkbox" id="f-heli" checked><span>Helicopters</span></label>
    <label class="switch"><input type="checkbox" id="f-ground" checked><span>Aircraft on the ground</span></label>
    <label class="switch"><input type="checkbox" id="f-military"><span>Military only</span></label>
    <h3>Airline / callsign starts with</h3>
    <input type="text" id="f-prefix" class="text-input" placeholder="e.g. PIA, UAE, BAW" autocomplete="off" spellcheck="false">
    <button class="link-btn" id="f-reset">Reset filters</button>
  </section>

  <section class="popover" id="panel-settings" hidden aria-label="Settings">
    <h3>Units</h3>
    <div class="segmented" id="unit-select"></div>
    <h3>Data</h3>
    <div class="data-status" id="data-status">Connecting…</div>
    <div id="app-section" hidden>
      <h3>App</h3>
      <div class="app-actions">
        <button class="link-btn" id="btn-report">Send diagnostics report</button>
        <button class="link-btn" id="btn-privacy" hidden>Ad privacy settings</button>
      </div>
      <div class="data-status" id="app-version"></div>
    </div>
    <h3 class="desktop-only">Shortcuts</h3>
    <ul class="shortcuts desktop-only">
      <li><kbd>/</kbd> Search</li>
      <li><kbd>Esc</kbd> Close / deselect</li>
      <li><kbd>F</kbd> Follow selected flight</li>
      <li><kbd>W</kbd> Whole world</li>
    </ul>
  </section>

  <!-- Flight details -->
  <aside class="details" id="details" hidden aria-live="polite" aria-label="Flight details"></aside>

  <!-- Status bar + legend -->
  <footer class="statusbar">
    <div class="status-pill" id="status-pill">
      <span class="live-dot" id="live-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
    <div class="legend" aria-label="Altitude colour legend">
      <div class="legend-bar" id="legend-bar"></div>
      <div class="legend-labels" id="legend-labels"></div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="tooltip" id="tooltip" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
