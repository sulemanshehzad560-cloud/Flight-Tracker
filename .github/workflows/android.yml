name: Android build

# Builds the Play Store bundle (AAB) plus the files Play Console uses to make crash reports readable,
# and a debug APK (with test ads) for trying the app on a phone.
on:
  push:
    paths:
      - 'android/**'
      - 'public/**'
      - 'lib/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools (offline map data)
        run: npm ci --no-audit --no-fund

      - name: Unit tests (web app + API)
        run: npm test

      - name: Build the offline base map
        run: npm run basemap

      - name: Check secrets (names only, never values)
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S3: ${{ secrets.ANDROID_KEY_ALIAS }}
          S4: ${{ secrets.ANDROID_KEY_PASSWORD }}
          S5: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          report() { if [ -n "$2" ]; then echo "✅ $1 is set (${#2} characters)"; else echo "::warning::❌ $1 is missing"; fi; }
          {
            echo "### Secrets"
            report ANDROID_KEYSTORE_BASE64 "$S1"
            report ANDROID_KEYSTORE_PASSWORD "$S2"
            report ANDROID_KEY_ALIAS "$S3"
            report ANDROID_KEY_PASSWORD "$S4"
            report AISSTREAM_API_KEY "$S5"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Live check of the ship feed (aisstream.io)
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: node scripts/check-aisstream.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set – the AAB is signed with a debug key and Play Console will reject it."
          fi

      - name: Build release bundle and debug APK
        working-directory: android
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          # Play needs a higher version code for every upload: 1000 + build number (1008, 1009, …).
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "Version code $VERSION_CODE, version name $VERSION_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug

      - name: Report sizes
        run: |
          ls -la android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/apk/debug/app-debug.apk
          echo "### Sizes" >> "$GITHUB_STEP_SUMMARY"
          du -h android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/apk/debug/app-debug.apk >> "$GITHUB_STEP_SUMMARY"

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload AAB (for Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: airsea-radar-${{ github.run_number }}-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0

      - name: Upload crash-analysis files (R8 mapping, native symbols)
        uses: actions/upload-artifact@v4
        with:
          name: airsea-radar-${{ github.run_number }}-debug-files
          path: |
            android/app/build/outputs/mapping/release/
            android/app/build/outputs/native-debug-symbols/release/
          if-no-files-found: warn

      - name: Upload debug APK (test ads, installable)
        uses: actions/upload-artifact@v4
        with:
          name: airsea-radar-${{ github.run_number }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
